name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *' # refresh the data snapshot baked into the pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    # Tell Bing/Yandex (IndexNow) about changed URLs after content pushes, not on every data refresh.
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Ping IndexNow
        run: |
          urls=$(curl -s https://hourglyph.github.io/sitemap-0.xml | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | jq -R . | jq -s .)
          jq -n --argjson urls "$urls" '{host:"hourglyph.github.io", key:"add88b12d4b8b2e144a508f120d36322", keyLocation:"https://hourglyph.github.io/add88b12d4b8b2e144a508f120d36322.txt", urlList:$urls}' \
            | curl -s -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d @-
